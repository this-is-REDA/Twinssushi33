# Twins Sushi — configuration Nginx (à adapter : chemin, version de PHP-FPM, certificat)
server {
    listen 80;
    server_name twinssushi.com www.twinssushi.com;
    return 301 https://www.twinssushi.com$request_uri;
}
server {
    listen 443 ssl http2;
    server_name www.twinssushi.com;
    root /var/www/twinssushi;
    index index.php;

    # Certificat (ex. Let's Encrypt via certbot)
    ssl_certificate     /etc/letsencrypt/live/www.twinssushi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.twinssushi.com/privkey.pem;

    # Dossiers internes : interdits
    location ~ ^/(data|inc|outils)(/|$) { deny all; return 403; }
    location ~ /\. { deny all; return 403; }
    # Aucun script dans les photos envoyées depuis l'admin
    location ~ ^/assets/menu/uploads/.*\.(php|phtml|phar|pl|py|cgi|sh)$ { deny all; return 403; }

    # Cache des fichiers statiques
    location ~* \.(webp|png|jpg|jpeg|svg|ico|woff2)$ { expires 30d; add_header Cache-Control "public"; }
    location ~* \.(css|js)$ { expires 365d; add_header Cache-Control "public, immutable"; }

    # Pages
    location / { try_files $uri $uri/ /index.php?$args; }
    error_page 404 /404.html;

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;   # adapter à la version installée
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    gzip on; gzip_types text/css application/javascript application/json image/svg+xml;
}
